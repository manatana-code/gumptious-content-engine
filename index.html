<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gumptious Content Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Afacad:wght@400;500;600&display=swap');

  :root {
    --blush: #F0E8E3;
    --mist: #C7D0D4;
    --sage: #9BB6BC;
    --earth: #6A3E1D;
    --slate: #415E6B;
    --white: #FDFAF8;
    --ink: #1C1C1C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--blush);
    font-family: 'Afacad', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 28px;
  }

  .page { max-width: 900px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--slate);
    padding-bottom: 24px;
    margin-bottom: 40px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--slate);
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 300;
    color: var(--earth);
  }

  h1 em { font-style: italic; color: var(--slate); }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 14px;
  }

  .card {
    background: var(--white);
    padding: 28px;
    margin-bottom: 16px;
  }

  input[type="text"], select, textarea {
    width: 100%;
    border: 1px solid var(--mist);
    background: var(--blush);
    font-family: 'Afacad', sans-serif;
    font-size: 14px;
    color: var(--ink);
    padding: 10px 13px;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--slate); }
  textarea { height: 200px; resize: vertical; line-height: 1.6; margin-bottom: 0; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .btn-primary {
    width: 100%;
    background: var(--earth);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    padding: 17px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-ghost {
    background: none;
    color: var(--slate);
    font-family: 'Afacad', sans-serif;
    font-size: 12px;
    padding: 6px 14px;
    border: 1px solid var(--mist);
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.05em;
  }

  .btn-ghost:hover { background: var(--blush); }
  .btn-ghost.copied { color: var(--earth); border-color: var(--earth); }

  /* PROGRESS */
  .progress-bar {
    display: none;
    background: var(--white);
    padding: 20px 24px;
    margin-bottom: 20px;
    border-left: 3px solid var(--earth);
  }

  .progress-bar.visible { display: block; }

  .progress-label {
    font-size: 13px;
    color: var(--slate);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .progress-track { background: var(--mist); height: 2px; width: 100%; }

  .progress-fill {
    background: var(--earth);
    height: 2px;
    width: 0%;
    transition: width 0.5s ease;
  }

  .progress-step {
    font-size: 11px;
    color: var(--sage);
    margin-top: 8px;
    letter-spacing: 0.05em;
  }

  .error {
    background: #fff0eb;
    border-left: 3px solid #a33;
    color: var(--earth);
    font-size: 13px;
    padding: 16px 20px;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  /* OUTPUT */
  .output-section { margin-top: 8px; }

  .output-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 12px;
    margin-top: 32px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--mist);
  }

  .output-heading:first-child { margin-top: 0; }

  .post-card {
    background: var(--white);
    padding: 24px;
    margin-bottom: 2px;
    border-left: 3px solid var(--mist);
    position: relative;
  }

  .post-card.li-thought { border-left-color: var(--earth); }
  .post-card.li-carousel { border-left-color: var(--sage); }
  .post-card.li-short { border-left-color: var(--slate); }
  .post-card.ig-carousel { border-left-color: var(--earth); }
  .post-card.ig-reel { border-left-color: var(--sage); }
  .post-card.ig-broll { border-left-color: var(--slate); }

  .post-type {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .post-type-label {
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .format-brief {
    font-size: 12px;
    color: var(--slate);
    background: rgba(155,182,188,0.12);
    border-left: 2px solid var(--sage);
    padding: 8px 12px;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .post-text {
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-actions {
    margin-top: 14px;
    display: flex;
    justify-content: flex-end;
  }

  footer {
    border-top: 1px solid var(--mist);
    padding-top: 18px;
    margin-top: 48px;
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 0.08em;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">Gumptious Design Shop</div>
    <h1>Content <em>Engine</em></h1>
  </header>

  <div class="section-label">Paste your source material</div>
  <div class="card">
    <div class="row">
      <div>
        <input type="text" id="title" placeholder="Title of your blog post or video">
        <select id="type">
          <option value="youtube">YouTube Video Script</option>
          <option value="blog">Blog Post</option>
        </select>
        <select id="pillar">
          <option value="expert">01 — Expert Insight</option>
          <option value="reality">02 — Client Reality</option>
          <option value="build">03 — Behind the Build</option>
        </select>
      </div>
      <div>
        <textarea id="source-content" placeholder="Paste your full script or blog post here..."></textarea>
      </div>
    </div>
  </div>

  <button class="btn-primary" id="gen-btn" onclick="generate()">Generate 6 Posts →</button>

  <div class="progress-bar" id="progress-bar">
    <div class="progress-label" id="progress-label">Generating your content...</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-step" id="progress-step"></div>
  </div>

  <div id="error-area"></div>
  <div id="output-area"></div>

</div>

<footer>
  <span>Gumptious Design Shop — Content Engine</span>
  <span>3 LinkedIn · 3 Instagram · schedule in Buffer</span>
</footer>

<script>
const VOICE = `You are writing content for Maria Fakhruddin, founder of Gumptious Design Shop. She helps women founders build premium service businesses through intentional design and brand identity. She has an MBA, 13 years of design experience, and a dry, British-inflected wit.

VOICE — this is non-negotiable:
- Write in flowing, connected prose. Not bullet points, not fragments.
- Sentences should be complete and properly constructed. Good English, not pedantic.
- Slightly witty, dry humour. Think British understatement, not American punchiness.
- Never use em dashes. Use commas, parentheses, or a new sentence instead.
- No short rhetorical questions dropped mid-paragraph ("Sound familiar?" "Why?" "What does that mean?")
- No patterns like "It is not X. It is Y." or "Not X, but Y." — these feel like AI wrote it.
- No words: leverage, synergy, ecosystem, thrilled, excited to announce, hustle, game-changer, transformative, empower, journey, authenticity (as a buzzword)
- Paragraphs should develop a thought, not just state it and move on.
- Maria connects unexpected things — design history, cultural observations, philosophy — to business and identity. This is her signature.
- She has opinions. She is not neutral. She does not hedge everything.
- Write as if she is talking to a smart, successful woman who has no patience for fluff.`;

const POSTS = [
  {
    id: 'li-thought',
    label: 'LinkedIn — Thought Piece',
    platform: 'LinkedIn',
    format: null,
    instruction: `Write a LinkedIn thought piece for Maria (200-250 words).

This post shares a genuine observation or idea connected to design, identity, positioning, or how women show up in business. It should feel like something Maria actually noticed or thought about this week, sparked by the source material.

Structure: One opening paragraph that draws the reader into an idea (not a hook, an opening). Two or three paragraphs that develop the thought, connect it to something unexpected, and arrive at a point of view. End on that point of view, not on a call to action.

No CTA. No "book an audit." Just a thought that lands.

Length: 200-250 words. One continuous piece of prose.`
  },
  {
    id: 'li-carousel',
    label: 'LinkedIn — Carousel Concept',
    platform: 'LinkedIn',
    format: 'Carousel post — design in Canva, upload as PDF to LinkedIn',
    instruction: `Write a LinkedIn carousel concept for Maria.

First, give a SLIDE BREAKDOWN:
- Slide 1: The hook (one bold statement or question — this is the cover)
- Slides 2-6: One idea per slide. Write the headline for each slide and one sentence of supporting copy.
- Last slide: A closing thought and soft CTA if appropriate.

Then write a SHORT CAPTION (2-3 sentences) that introduces the carousel without giving everything away. This goes in the LinkedIn post text above the carousel.

The topic should come directly from the source material but approached as a teaching moment.`
  },
  {
    id: 'li-short',
    label: 'LinkedIn — YouTube Short Caption',
    platform: 'LinkedIn',
    format: 'Native video upload — post the Short directly to LinkedIn',
    instruction: `Write a LinkedIn caption for a YouTube Short (2-3 sentences only).

This introduces a short video Maria is uploading natively to LinkedIn. It should make someone stop scrolling and want to watch. It is not a full post. It is a door, not a room.

Do not summarise the video. Create curiosity about it. End with one sentence that hints at what they will get from watching.`
  },
  {
    id: 'ig-carousel',
    label: 'Instagram — Carousel',
    platform: 'Instagram',
    format: 'Carousel: 6-8 slides. Slide 1 = bold hook. Slides 2-6 = one idea per slide, minimal text. Last slide = soft CTA.',
    instruction: `Write an Instagram carousel for Maria.

First, give a SLIDE BREAKDOWN:
- Slide 1: The hook — one bold, visual statement
- Slides 2-6: One idea per slide, written as the actual slide text (short, visual-first)
- Last slide: A closing line and CTA

Then write the CAPTION (3-4 sentences, casual, warm, Instagram-native tone — different from the LinkedIn version of the same idea). End with exactly 5 relevant hashtags on a new line. No more, no fewer.`
  },
  {
    id: 'ig-reel',
    label: 'Instagram — Talking Head Reel',
    platform: 'Instagram',
    format: 'Talking head Reel — film yourself to camera, casual, 30-60 seconds, subtitles on. No script needed, just the hook and the point.',
    instruction: `Write an Instagram Reel concept and caption for Maria.

First, give a REEL BRIEF (2-3 sentences): What Maria should say to camera. The opening line, the core point, how to end it. Keep it casual, like she is talking to a friend who runs a business.

Then write the CAPTION (2-3 sentences, conversational). End with exactly 5 relevant hashtags on a new line.`
  },
  {
    id: 'ig-broll',
    label: 'Instagram — B-roll + Text Overlay',
    platform: 'Instagram',
    format: 'B-roll or single image with text overlay — film a real moment (desk, process, studio, thinking). The text carries the message, not the visuals.',
    instruction: `Write an Instagram B-roll post for Maria.

First, give a VISUAL BRIEF (1-2 sentences): What Maria should film or photograph. Keep it simple and real, not staged.

Then give the TEXT OVERLAY (the words that appear on screen — one short, strong sentence or phrase).

Then write the CAPTION (2-3 sentences, warm, human, low effort — this is the most personal post of the week). End with exactly 5 relevant hashtags on a new line.`
  }
];

function setProgress(pct, step) {
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-step').textContent = step;
}

async function callAPI(prompt) {
  const response = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt })
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error);
  return data.text;
}

async function generate() {
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('source-content').value.trim();
  const type = document.getElementById('type').value;
  const pillar = document.getElementById('pillar').value;

  if (!content) { alert('Paste your source material first.'); return; }

  const PILLARS = { expert: '01 Expert Insight', reality: '02 Client Reality', build: '03 Behind the Build' };

  const btn = document.getElementById('gen-btn');
  const progressBar = document.getElementById('progress-bar');
  const errorArea = document.getElementById('error-area');
  const outputArea = document.getElementById('output-area');

  btn.disabled = true;
  progressBar.classList.add('visible');
  errorArea.innerHTML = '';
  outputArea.innerHTML = '';

  const results = [];

  try {
    for (let i = 0; i < POSTS.length; i++) {
      const post = POSTS[i];
      const pct = Math.round((i / POSTS.length) * 100);
      setProgress(pct, `Generating ${post.label}...`);

      const prompt = `${VOICE}

SOURCE MATERIAL:
Title: ${title || 'Untitled'}
Type: ${type === 'youtube' ? 'YouTube Video Script' : 'Blog Post'}
Content Pillar: ${PILLARS[pillar]}

${content}

---

${post.instruction}

Write only the content itself. No preamble, no "Here is the post", no meta-commentary. Just the post.`;

      try {
        const text = await callAPI(prompt);
        results.push({ ...post, text });
      } catch(err) {
        results.push({ ...post, text: `Could not generate this post. ${err.message}` });
      }

      await new Promise(r => setTimeout(r, 400));
    }

    setProgress(100, 'Done.');
    setTimeout(() => progressBar.classList.remove('visible'), 800);
    renderOutput(results, title);

  } catch(err) {
    progressBar.classList.remove('visible');
    errorArea.innerHTML = `<div class="error"><strong>Something went wrong.</strong> ${err.message}</div>`;
  }

  btn.disabled = false;
}

function renderOutput(results, title) {
  const li = results.filter(r => r.platform === 'LinkedIn');
  const ig = results.filter(r => r.platform === 'Instagram');

  const renderCard = (post) => `
    <div class="post-card ${post.id}">
      <div class="post-type">
        <span>${post.platform}</span>
        <span class="post-type-label">${post.label.split('— ')[1]}</span>
      </div>
      ${post.format ? `<div class="format-brief">📐 ${post.format}</div>` : ''}
      <div class="post-text">${escHtml(post.text)}</div>
      <div class="post-actions">
        <button class="btn-ghost" onclick="copyPost(this, ${JSON.stringify(post.text)})">Copy</button>
      </div>
    </div>
  `;

  document.getElementById('output-area').innerHTML = `
    <div class="output-section">
      <div class="output-heading">LinkedIn — 3 posts</div>
      ${li.map(renderCard).join('')}
      <div class="output-heading">Instagram — 3 posts</div>
      ${ig.map(renderCard).join('')}
    </div>
  `;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function copyPost(btn, text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    }).catch(() => fallbackCopy(btn, text));
  } else {
    fallbackCopy(btn, text);
  }
}

function fallbackCopy(btn, text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  } catch(e) {
    btn.textContent = 'Select text above';
  }
  document.body.removeChild(ta);
}
</script>
</body>
</html>
