<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gumptious Content Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Afacad:wght@400;500;600&display=swap');

  :root {
    --blush: #F0E8E3;
    --mist: #C7D0D4;
    --sage: #9BB6BC;
    --earth: #6A3E1D;
    --slate: #415E6B;
    --white: #FDFAF8;
    --ink: #1C1C1C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--blush);
    font-family: 'Afacad', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 28px;
  }

  .page { max-width: 960px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--slate);
    padding-bottom: 24px;
    margin-bottom: 40px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--slate);
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 300;
    color: var(--earth);
  }

  h1 em { font-style: italic; color: var(--slate); }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 14px;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--mist);
  }

  .tab-btn {
    font-family: 'Afacad', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--slate);
    background: none;
    border: none;
    padding: 12px 22px;
    cursor: pointer;
    opacity: 0.45;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }

  .tab-btn.active { opacity: 1; border-bottom-color: var(--earth); color: var(--earth); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* CARDS */
  .card {
    background: var(--white);
    padding: 28px;
    margin-bottom: 16px;
  }

  .card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 14px;
  }

  /* FORM ELEMENTS */
  input[type="text"], select, textarea {
    width: 100%;
    border: 1px solid var(--mist);
    background: var(--blush);
    font-family: 'Afacad', sans-serif;
    font-size: 14px;
    color: var(--ink);
    padding: 10px 13px;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--slate); }

  textarea { height: 140px; resize: vertical; line-height: 1.6; margin-bottom: 0; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* BUTTONS */
  .btn-primary {
    width: 100%;
    background: var(--earth);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    padding: 16px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: opacity 0.15s;
    margin-top: 4px;
  }

  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-secondary {
    background: var(--slate);
    color: var(--white);
    font-family: 'Afacad', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.15s;
  }

  .btn-secondary:hover { opacity: 0.8; }

  .btn-ghost {
    background: none;
    color: var(--slate);
    font-family: 'Afacad', sans-serif;
    font-size: 11px;
    padding: 5px 11px;
    border: 1px solid var(--mist);
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-ghost:hover { background: var(--blush); }
  .btn-ghost.danger { color: #a33; border-color: rgba(170,50,50,0.3); }

  /* STATUS */
  .status {
    background: var(--earth);
    color: var(--white);
    font-size: 13px;
    padding: 13px 20px;
    margin-bottom: 20px;
    display: none;
    letter-spacing: 0.03em;
  }

  .status.visible { display: block; }

  .error {
    background: #fff0eb;
    border-left: 3px solid #a33;
    color: var(--earth);
    font-size: 13px;
    padding: 16px 20px;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  /* PILLAR TAGS */
  .pillar-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    margin-bottom: 8px;
  }

  .pillar-tag.expert { background: #F5EDE7; color: var(--earth); }
  .pillar-tag.reality { background: #E8F0F2; color: var(--slate); }
  .pillar-tag.build { background: #EBF0F2; color: #2d4a55; }

  .platform-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    margin-bottom: 8px;
    margin-left: 6px;
  }

  .platform-tag.linkedin { background: #e8eef5; color: #0077b5; }
  .platform-tag.instagram { background: #f5e8f0; color: #833AB4; }

  /* OUTPUT POSTS */
  .output-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    margin-bottom: 32px;
  }

  .post-card {
    background: var(--white);
    padding: 20px;
    border-top: 3px solid var(--mist);
    position: relative;
  }

  .post-card.expert { border-top-color: var(--earth); }
  .post-card.reality { border-top-color: var(--sage); }
  .post-card.build { border-top-color: var(--slate); }

  .post-meta {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 4px;
  }

  .post-day {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
    margin-right: 6px;
  }

  .post-text {
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .format-brief {
    font-size: 11px;
    color: var(--slate);
    background: rgba(155,182,188,0.15);
    border-left: 2px solid var(--sage);
    padding: 6px 10px;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .post-actions { margin-top: 12px; display: flex; gap: 8px; }

  /* VAULT */
  .vault-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .vault-controls input {
    flex: 1;
    min-width: 180px;
    margin-bottom: 0;
  }

  .vault-controls select { width: auto; margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; background: var(--white); }

  th {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
    text-align: left;
    padding: 13px 16px;
    border-bottom: 1px solid var(--mist);
  }

  td {
    font-size: 13px;
    padding: 13px 16px;
    border-bottom: 1px solid rgba(199,208,212,0.25);
    vertical-align: middle;
  }

  tr:hover td { background: rgba(240,232,227,0.3); }

  .type-badge {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
  }

  .type-badge.blog { background: #E8F0F2; color: var(--slate); }
  .type-badge.youtube { background: #fff0eb; color: #C4302B; }

  .empty-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--sage);
  }

  .empty-state p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--slate);
    margin-bottom: 6px;
  }

  /* MODAL */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .overlay.open { display: flex; }

  .modal {
    background: var(--white);
    width: 560px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    padding: 36px;
  }

  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 400;
    color: var(--earth);
    margin-bottom: 22px;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 7px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    margin-bottom: 0;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions .btn-primary { font-size: 17px; padding: 13px; }

  footer {
    border-top: 1px solid var(--mist);
    padding-top: 18px;
    margin-top: 48px;
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 0.08em;
    display: flex;
    justify-content: space-between;
  }

  .week-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--ink);
    margin-bottom: 20px;
  }

  .week-heading em { font-style: italic; color: var(--earth); }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">Gumptious Design Shop</div>
    <h1>Content <em>Engine</em></h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('generate', this)">Generate</button>
    <button class="tab-btn" onclick="switchTab('vault', this)">Vault</button>
  </div>

  <!-- GENERATE -->
  <div class="tab-panel active" id="tab-generate">

    <div class="section-label">Step 1 — Add your source material</div>
    <div class="card">
      <div class="row">
        <div>
          <input type="text" id="title" placeholder="Title of your blog post or video">
          <select id="type">
            <option value="youtube">YouTube Video</option>
            <option value="blog">Blog Post</option>
          </select>
          <select id="pillar">
            <option value="expert">01 — Expert Insight</option>
            <option value="reality">02 — Client Reality</option>
            <option value="build">03 — Behind the Build</option>
          </select>
        </div>
        <div>
          <textarea id="source-content" placeholder="Paste your script or blog post here..."></textarea>
        </div>
      </div>
    </div>

    <div class="section-label" style="margin-top:8px">Step 2 — Generate</div>
    <div class="card" style="padding:20px">
      <div class="row" style="margin-bottom:12px">
        <div>
          <label style="font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--sage);display:block;margin-bottom:7px">Output</label>
          <select id="output-scope">
            <option value="week">This week (6 posts)</option>
            <option value="month">This month (24 posts)</option>
          </select>
        </div>
        <div>
          <label style="font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--sage);display:block;margin-bottom:7px">Wednesday LinkedIn rotates</label>
          <select id="wed-rotation">
            <option value="reality">02 Client Reality</option>
            <option value="build">03 Behind the Build</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="gen-btn" onclick="generate()">Generate Content →</button>
    </div>

    <div class="status" id="status">Generating your content — takes about 20 seconds...</div>
    <div id="error-area"></div>
    <div id="output-area"></div>

  </div>

  <!-- VAULT -->
  <div class="tab-panel" id="tab-vault">

    <div class="vault-controls">
      <input type="text" id="vault-search" placeholder="Search..." oninput="renderVault()">
      <select id="vault-type-filter" onchange="renderVault()" style="width:auto;margin-bottom:0">
        <option value="all">All types</option>
        <option value="youtube">Videos</option>
        <option value="blog">Blogs</option>
      </select>
      <select id="vault-pillar-filter" onchange="renderVault()" style="width:auto;margin-bottom:0">
        <option value="all">All pillars</option>
        <option value="expert">01 Expert Insight</option>
        <option value="reality">02 Client Reality</option>
        <option value="build">03 Behind the Build</option>
      </select>
      <button class="btn-secondary" onclick="openModal()">+ Add Content</button>
    </div>

    <div id="vault-table"></div>

  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add to Vault</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="m-title" placeholder="Enter title">
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="m-type">
        <option value="youtube">YouTube Video</option>
        <option value="blog">Blog Post</option>
      </select>
    </div>
    <div class="form-group">
      <label>Content Pillar</label>
      <select id="m-pillar">
        <option value="expert">01 — Expert Insight</option>
        <option value="reality">02 — Client Reality</option>
        <option value="build">03 — Behind the Build</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date Published</label>
      <input type="text" id="m-date" placeholder="e.g. April 2026">
    </div>
    <div class="form-group">
      <label>Paste Content</label>
      <textarea id="m-content" placeholder="Full script or post text..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveToVault()">Save to Vault</button>
      <button class="btn-ghost" onclick="closeModal()" style="padding:13px 20px">Cancel</button>
    </div>
  </div>
</div>

<script>
const PILLARS = { expert: '01 Expert Insight', reality: '02 Client Reality', build: '03 Behind the Build' };

let vault = JSON.parse(localStorage.getItem('gumptious_vault') || '[]');
let nextId = parseInt(localStorage.getItem('gumptious_nextid') || '1');
let currentOutput = null;

function saveVault() {
  localStorage.setItem('gumptious_vault', JSON.stringify(vault));
  localStorage.setItem('gumptious_nextid', String(nextId));
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'vault') renderVault();
}

// --- VAULT ---
function renderVault() {
  const search = (document.getElementById('vault-search').value || '').toLowerCase();
  const tf = document.getElementById('vault-type-filter').value;
  const pf = document.getElementById('vault-pillar-filter').value;

  let items = vault.filter(v => {
    if (search && !v.title.toLowerCase().includes(search)) return false;
    if (tf !== 'all' && v.type !== tf) return false;
    if (pf !== 'all' && v.pillar !== pf) return false;
    return true;
  });

  const container = document.getElementById('vault-table');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><p>Nothing in the vault yet.</p><small>Add your blog posts and videos using the button above.</small></div>`;
    return;
  }

  container.innerHTML = `<table>
    <thead><tr>
      <th>Title</th><th>Type</th><th>Pillar</th><th>Date</th><th></th>
    </tr></thead>
    <tbody>${items.map(v => `<tr>
      <td style="font-weight:500">${v.title}</td>
      <td><span class="type-badge ${v.type}">${v.type === 'youtube' ? 'Video' : 'Blog'}</span></td>
      <td><span class="pillar-tag ${v.pillar}">${PILLARS[v.pillar]}</span></td>
      <td style="font-size:12px;color:var(--sage)">${v.date || '—'}</td>
      <td><button class="btn-ghost danger" onclick="removeItem(${v.id})">Remove</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function removeItem(id) {
  if (!confirm('Remove this item?')) return;
  vault = vault.filter(v => v.id !== id);
  saveVault();
  renderVault();
}

function openModal() {
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  ['m-title','m-date','m-content'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-type').value = 'youtube';
  document.getElementById('m-pillar').value = 'expert';
}

function saveToVault() {
  const title = document.getElementById('m-title').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  vault.unshift({
    id: nextId++,
    title,
    type: document.getElementById('m-type').value,
    pillar: document.getElementById('m-pillar').value,
    date: document.getElementById('m-date').value || '',
    content: document.getElementById('m-content').value
  });
  saveVault();
  closeModal();
  renderVault();
}

// --- GENERATE ---
async function generate() {
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('source-content').value.trim();
  const type = document.getElementById('type').value;
  const pillar = document.getElementById('pillar').value;
  const scope = document.getElementById('output-scope').value;
  const wedRotation = document.getElementById('wed-rotation').value;

  if (!content) { alert('Paste some source material first.'); return; }

  // Save to vault automatically
  if (title) {
    const exists = vault.find(v => v.title.toLowerCase() === title.toLowerCase());
    if (!exists) {
      vault.unshift({ id: nextId++, title, type, pillar, date: new Date().toLocaleDateString('en-US', {month:'long', year:'numeric'}), content });
      saveVault();
    }
  }

  // Build vault context for resurfacing
  const vaultContext = vault.slice(0, 10).map(v => `- ${v.title} (${v.type === 'youtube' ? 'Video' : 'Blog'}, ${PILLARS[v.pillar]})`).join('\n');

  const isMonth = scope === 'month';
  const wedLabel = wedRotation === 'reality' ? '02 Client Reality' : '03 Behind the Build';
  const wedPillarKey = wedRotation;

  const prompt = `You are a content strategist for Maria Fakhruddin, founder of Gumptious Design Shop. She helps women founders build premium service businesses through intentional design and brand identity.

CONTENT PILLARS (every post must map to one):
01 Expert Insight — authority, design/positioning observations, counterintuitive takes. LinkedIn Mon, IG Carousel Tue.
02 Client Reality — proof, the gap between what clients think they need vs what moves them. LinkedIn Wed (rotating), IG Reel Thu.
03 Behind the Build — humanity, building Gumptious honestly. LinkedIn Fri, IG Single/Story Fri.

VOICE (non-negotiable):
- Sharp, warm, direct. Never corporate.
- No em dashes. Use commas or periods instead.
- Banned words: leverage, synergy, ecosystem, thrilled, excited to announce, hustle
- First line must stop the scroll. Specific, surprising, or punchy.
- Short paragraphs — 1 to 3 sentences max.
- LinkedIn and Instagram NEVER say the same thing. Different angle, different format, different tone.
- Instagram is more casual, conversational, visual-first.
- LinkedIn is authority-building, structured, professional but human.
- End each LinkedIn post with a soft CTA to book an audit call at gumptiousdesignshop.com/audit
- Every Instagram post must end with exactly 5 relevant hashtags. No more, no fewer.

INSTAGRAM FORMAT BRIEFS (add a "format" field on every Instagram post, 1 sentence):
- Tuesday (Expert Insight): Carousel. 6-8 slides, one idea per slide, strong hook on slide 1, soft CTA on last slide.
- Thursday (Client Reality): Talking head Reel. Film yourself to camera, casual, 30-60 sec, subtitles on.
- Friday (Behind the Build): B-roll + text overlay. Film a real moment, let the text carry the message.

SOURCE MATERIAL:
Title: ${title || 'Untitled'}
Type: ${type === 'youtube' ? 'YouTube Video' : 'Blog Post'}
Primary Pillar: ${PILLARS[pillar]}

${content}

EXISTING VAULT (for resurfacing older content):
${vaultContext || 'No previous content yet.'}

${isMonth ? `Generate ONE FULL MONTH of content (4 weeks). For each week, also weave in a reference or resurface from the vault where relevant.` : `Generate ONE WEEK of content.`}

Return ONLY valid JSON. No preamble, no markdown fences. Use this exact structure${isMonth ? ' as an array of 4 week objects' : ''}:

${isMonth ? `[
  {
    "week": 1,
    "monday_linkedin": {"pillar": "expert", "platform": "linkedin", "day": "Monday", "text": "..."},
    "tuesday_instagram": {"pillar": "expert", "platform": "instagram", "day": "Tuesday", "format": "...", "text": "..."},
    "wednesday_linkedin": {"pillar": "${wedPillarKey}", "platform": "linkedin", "day": "Wednesday", "text": "..."},
    "thursday_instagram": {"pillar": "reality", "platform": "instagram", "day": "Thursday", "format": "...", "text": "..."},
    "friday_linkedin": {"pillar": "build", "platform": "linkedin", "day": "Friday", "text": "..."},
    "friday_instagram": {"pillar": "build", "platform": "instagram", "day": "Friday", "format": "...", "text": "..."}
  }
]` : `{
  "monday_linkedin": {"pillar": "expert", "platform": "linkedin", "day": "Monday", "text": "..."},
  "tuesday_instagram": {"pillar": "expert", "platform": "instagram", "day": "Tuesday", "format": "...", "text": "..."},
  "wednesday_linkedin": {"pillar": "${wedPillarKey}", "platform": "linkedin", "day": "Wednesday", "text": "..."},
  "thursday_instagram": {"pillar": "reality", "platform": "instagram", "day": "Thursday", "format": "...", "text": "..."},
  "friday_linkedin": {"pillar": "build", "platform": "linkedin", "day": "Friday", "text": "..."},
  "friday_instagram": {"pillar": "build", "platform": "instagram", "day": "Friday", "format": "...", "text": "..."}
}`}`;

  const btn = document.getElementById('gen-btn');
  const status = document.getElementById('status');
  const errorArea = document.getElementById('error-area');
  btn.disabled = true;
  status.classList.add('visible');
  errorArea.innerHTML = '';
  document.getElementById('output-area').innerHTML = '';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: isMonth ? 8000 : 3000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const raw = data.content.map(c => c.text || '').join('');
    const clean = raw.replace(/^```json\s*/,'').replace(/\s*```$/,'').trim();
    const parsed = JSON.parse(clean);
    currentOutput = parsed;
    renderOutput(parsed, isMonth, title);
  } catch (err) {
    errorArea.innerHTML = `<div class="error"><strong>Something went wrong.</strong> ${err.message}<br><small style="color:var(--sage);margin-top:4px;display:block">Try with shorter source material, or paste just the key sections.</small></div>`;
  } finally {
    btn.disabled = false;
    status.classList.remove('visible');
  }
}

const POST_KEYS = ['monday_linkedin','tuesday_instagram','wednesday_linkedin','thursday_instagram','friday_linkedin','friday_instagram'];

function renderOutput(data, isMonth, sourceTitle) {
  const container = document.getElementById('output-area');

  if (isMonth && Array.isArray(data)) {
    container.innerHTML = data.map((week, i) => `
      <div class="week-heading" style="margin-bottom:16px;margin-top:${i > 0 ? '36px' : '0'}">Week <em>${week.week || i+1}</em></div>
      <div class="output-grid">${renderPostCards(week)}</div>
    `).join('');
  } else {
    container.innerHTML = `
      <div class="week-heading" style="margin-bottom:16px">This week${sourceTitle ? ' — <em>' + sourceTitle + '</em>' : ''}</div>
      <div class="output-grid">${renderPostCards(data)}</div>
    `;
  }
}

function renderPostCards(weekData) {
  return POST_KEYS.map(key => {
    const post = weekData[key];
    if (!post) return '';
    return `
      <div class="post-card ${post.pillar}">
        <div class="post-meta">
          <span class="post-day">${post.day}</span>
          <span class="pillar-tag ${post.pillar}">${PILLARS[post.pillar]}</span>
          <span class="platform-tag ${post.platform}">${post.platform}</span>
        </div>
        ${post.format ? `<div class="format-brief">📐 ${escHtml(post.format)}</div>` : ''}
        <div class="post-text">${escHtml(post.text)}</div>
        <div class="post-actions">
          <button class="btn-ghost" onclick="copyPost(this, '${escHtml(post.text)}')">Copy</button>
        </div>
      </div>
    `;
  }).join('');
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyPost(btn, text) {
  const decoded = text.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  navigator.clipboard.writeText(decoded).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}
