<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gumptious Content Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Afacad:wght@400;500;600&display=swap');

  :root {
    --blush: #F0E8E3;
    --mist: #C7D0D4;
    --sage: #9BB6BC;
    --earth: #6A3E1D;
    --slate: #415E6B;
    --white: #FDFAF8;
    --ink: #1C1C1C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--blush);
    font-family: 'Afacad', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 28px;
  }

  .page { max-width: 960px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--slate);
    padding-bottom: 24px;
    margin-bottom: 40px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--slate);
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 300;
    color: var(--earth);
  }

  h1 em { font-style: italic; color: var(--slate); }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 14px;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--mist);
    margin-bottom: 36px;
  }

  .tab-btn {
    font-family: 'Afacad', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--slate);
    background: none;
    border: none;
    padding: 12px 22px;
    cursor: pointer;
    opacity: 0.45;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }

  .tab-btn.active { opacity: 1; border-bottom-color: var(--earth); color: var(--earth); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--white);
    padding: 28px;
    margin-bottom: 16px;
  }

  input[type="text"], select, textarea {
    width: 100%;
    border: 1px solid var(--mist);
    background: var(--blush);
    font-family: 'Afacad', sans-serif;
    font-size: 14px;
    color: var(--ink);
    padding: 10px 13px;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--slate); }
  textarea { height: 160px; resize: vertical; line-height: 1.6; margin-bottom: 0; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-primary {
    width: 100%;
    background: var(--earth);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    padding: 16px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 4px;
  }

  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-secondary {
    background: var(--slate);
    color: var(--white);
    font-family: 'Afacad', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border: none;
    cursor: pointer;
  }

  .btn-ghost {
    background: none;
    color: var(--slate);
    font-family: 'Afacad', sans-serif;
    font-size: 11px;
    padding: 5px 11px;
    border: 1px solid var(--mist);
    cursor: pointer;
  }

  .btn-ghost:hover { background: var(--blush); }
  .btn-ghost.danger { color: #a33; border-color: rgba(170,50,50,0.3); }

  /* PROGRESS */
  .progress-bar {
    display: none;
    background: var(--white);
    padding: 20px 24px;
    margin-bottom: 20px;
    border-left: 3px solid var(--earth);
  }

  .progress-bar.visible { display: block; }

  .progress-label {
    font-size: 13px;
    color: var(--slate);
    margin-bottom: 10px;
  }

  .progress-track {
    background: var(--mist);
    height: 3px;
    width: 100%;
  }

  .progress-fill {
    background: var(--earth);
    height: 3px;
    width: 0%;
    transition: width 0.4s ease;
  }

  .progress-step {
    font-size: 11px;
    color: var(--sage);
    margin-top: 8px;
    letter-spacing: 0.05em;
  }

  .error {
    background: #fff0eb;
    border-left: 3px solid #a33;
    color: var(--earth);
    font-size: 13px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }

  /* OUTPUT */
  .output-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    margin-bottom: 32px;
  }

  .post-card {
    background: var(--white);
    padding: 20px;
    border-top: 3px solid var(--mist);
  }

  .post-card.expert { border-top-color: var(--earth); }
  .post-card.reality { border-top-color: var(--sage); }
  .post-card.build { border-top-color: var(--slate); }
  .post-card.loading { opacity: 0.5; }

  .post-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 10px;
  }

  .post-day {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
    margin-right: 4px;
  }

  .pillar-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
  }

  .pillar-tag.expert { background: #F5EDE7; color: var(--earth); }
  .pillar-tag.reality { background: #E8F0F2; color: var(--slate); }
  .pillar-tag.build { background: #EBF0F2; color: #2d4a55; }

  .platform-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
  }

  .platform-tag.linkedin { background: #e8eef5; color: #0077b5; }
  .platform-tag.instagram { background: #f5e8f0; color: #833AB4; }

  .format-brief {
    font-size: 11px;
    color: var(--slate);
    background: rgba(155,182,188,0.15);
    border-left: 2px solid var(--sage);
    padding: 6px 10px;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .post-text {
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-actions { margin-top: 12px; }

  .loading-text {
    font-size: 13px;
    color: var(--sage);
    font-style: italic;
    padding: 20px 0;
  }

  .week-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--ink);
    margin-bottom: 16px;
    margin-top: 32px;
  }

  .week-heading:first-child { margin-top: 0; }
  .week-heading em { font-style: italic; color: var(--earth); }

  /* VAULT */
  .vault-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .vault-controls input { flex: 1; min-width: 180px; margin-bottom: 0; }
  .vault-controls select { width: auto; margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; background: var(--white); }

  th {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
    text-align: left;
    padding: 13px 16px;
    border-bottom: 1px solid var(--mist);
  }

  td {
    font-size: 13px;
    padding: 13px 16px;
    border-bottom: 1px solid rgba(199,208,212,0.25);
    vertical-align: middle;
  }

  tr:hover td { background: rgba(240,232,227,0.3); }

  .type-badge {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
  }

  .type-badge.blog { background: #E8F0F2; color: var(--slate); }
  .type-badge.youtube { background: #fff0eb; color: #C4302B; }

  .empty-state {
    text-align: center;
    padding: 56px 20px;
  }

  .empty-state p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--slate);
    margin-bottom: 6px;
  }

  .empty-state small { font-size: 13px; color: var(--sage); }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .overlay.open { display: flex; }

  .modal {
    background: var(--white);
    width: 560px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    padding: 36px;
  }

  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 400;
    color: var(--earth);
    margin-bottom: 22px;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 7px;
  }

  .form-group input, .form-group select, .form-group textarea { margin-bottom: 0; }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions .btn-primary { font-size: 17px; padding: 13px; }

  footer {
    border-top: 1px solid var(--mist);
    padding-top: 18px;
    margin-top: 48px;
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 0.08em;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">Gumptious Design Shop</div>
    <h1>Content <em>Engine</em></h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('generate', this)">Generate</button>
    <button class="tab-btn" onclick="switchTab('vault', this)">Vault</button>
  </div>

  <!-- GENERATE -->
  <div class="tab-panel active" id="tab-generate">

    <div class="section-label">Step 1 — Add your source material</div>
    <div class="card">
      <div class="row">
        <div>
          <input type="text" id="title" placeholder="Title of your blog post or video">
          <select id="type">
            <option value="youtube">YouTube Video</option>
            <option value="blog">Blog Post</option>
          </select>
          <select id="pillar">
            <option value="expert">01 — Expert Insight</option>
            <option value="reality">02 — Client Reality</option>
            <option value="build">03 — Behind the Build</option>
          </select>
        </div>
        <div>
          <textarea id="source-content" placeholder="Paste your script or blog post here..."></textarea>
        </div>
      </div>
    </div>

    <div class="section-label" style="margin-top:8px">Step 2 — Generate</div>
    <div class="card" style="padding:20px">
      <div class="row" style="margin-bottom:12px">
        <div>
          <label style="font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--sage);display:block;margin-bottom:7px">Output</label>
          <select id="output-scope">
            <option value="week">This week (6 posts)</option>
            <option value="month">This month (24 posts)</option>
          </select>
        </div>
        <div>
          <label style="font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--sage);display:block;margin-bottom:7px">Wednesday LinkedIn rotates</label>
          <select id="wed-rotation">
            <option value="reality">02 Client Reality</option>
            <option value="build">03 Behind the Build</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="gen-btn" onclick="generate()">Generate Content →</button>
    </div>

    <div class="progress-bar" id="progress-bar">
      <div class="progress-label">Generating your content...</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-step" id="progress-step">Starting...</div>
    </div>

    <div id="error-area"></div>
    <div id="output-area"></div>

  </div>

  <!-- VAULT -->
  <div class="tab-panel" id="tab-vault">
    <div class="vault-controls">
      <input type="text" id="vault-search" placeholder="Search..." oninput="renderVault()">
      <select id="vault-type-filter" onchange="renderVault()" style="width:auto;margin-bottom:0">
        <option value="all">All types</option>
        <option value="youtube">Videos</option>
        <option value="blog">Blogs</option>
      </select>
      <select id="vault-pillar-filter" onchange="renderVault()" style="width:auto;margin-bottom:0">
        <option value="all">All pillars</option>
        <option value="expert">01 Expert Insight</option>
        <option value="reality">02 Client Reality</option>
        <option value="build">03 Behind the Build</option>
      </select>
      <button class="btn-secondary" onclick="openModal()">+ Add Content</button>
    </div>
    <div id="vault-table"></div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add to Vault</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="m-title" placeholder="Enter title">
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="m-type">
        <option value="youtube">YouTube Video</option>
        <option value="blog">Blog Post</option>
      </select>
    </div>
    <div class="form-group">
      <label>Content Pillar</label>
      <select id="m-pillar">
        <option value="expert">01 — Expert Insight</option>
        <option value="reality">02 — Client Reality</option>
        <option value="build">03 — Behind the Build</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date Published</label>
      <input type="text" id="m-date" placeholder="e.g. April 2026">
    </div>
    <div class="form-group">
      <label>Paste Content</label>
      <textarea id="m-content" placeholder="Full script or post text..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveToVault()">Save to Vault</button>
      <button class="btn-ghost" onclick="closeModal()" style="padding:13px 20px">Cancel</button>
    </div>
  </div>
</div>

<footer>
  <span>Gumptious Design Shop — Content Engine</span>
  <span>3× LinkedIn · 3× Instagram · mapped to your pillars</span>
</footer>

<script>
const PILLARS = { expert: '01 Expert Insight', reality: '02 Client Reality', build: '03 Behind the Build' };

let vault = JSON.parse(localStorage.getItem('gumptious_vault') || '[]');
let nextId = parseInt(localStorage.getItem('gumptious_nextid') || '1');

function saveVault() {
  localStorage.setItem('gumptious_vault', JSON.stringify(vault));
  localStorage.setItem('gumptious_nextid', String(nextId));
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'vault') renderVault();
}

// VAULT
function renderVault() {
  const search = (document.getElementById('vault-search').value || '').toLowerCase();
  const tf = document.getElementById('vault-type-filter').value;
  const pf = document.getElementById('vault-pillar-filter').value;
  let items = vault.filter(v => {
    if (search && !v.title.toLowerCase().includes(search)) return false;
    if (tf !== 'all' && v.type !== tf) return false;
    if (pf !== 'all' && v.pillar !== pf) return false;
    return true;
  });
  const container = document.getElementById('vault-table');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><p>Nothing in the vault yet.</p><small>Add your blog posts and videos using the button above.</small></div>`;
    return;
  }
  container.innerHTML = `<table>
    <thead><tr><th>Title</th><th>Type</th><th>Pillar</th><th>Date</th><th></th></tr></thead>
    <tbody>${items.map(v => `<tr>
      <td style="font-weight:500">${v.title}</td>
      <td><span class="type-badge ${v.type}">${v.type === 'youtube' ? 'Video' : 'Blog'}</span></td>
      <td><span class="pillar-tag ${v.pillar}">${PILLARS[v.pillar]}</span></td>
      <td style="font-size:12px;color:var(--sage)">${v.date || '—'}</td>
      <td><button class="btn-ghost danger" onclick="removeItem(${v.id})">Remove</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function removeItem(id) {
  if (!confirm('Remove this item?')) return;
  vault = vault.filter(v => v.id !== id);
  saveVault(); renderVault();
}

function openModal() { document.getElementById('overlay').classList.add('open'); }
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  ['m-title','m-date','m-content'].forEach(id => document.getElementById(id).value = '');
}

function saveToVault() {
  const title = document.getElementById('m-title').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  vault.unshift({ id: nextId++, title, type: document.getElementById('m-type').value, pillar: document.getElementById('m-pillar').value, date: document.getElementById('m-date').value || '', content: document.getElementById('m-content').value });
  saveVault(); closeModal(); renderVault();
}

// GENERATE
const VOICE = `You are writing social media content for Maria Fakhruddin, founder of Gumptious Design Shop. She helps women founders build premium service businesses through intentional design and brand identity.

VOICE RULES (non-negotiable):
- Sharp, warm, direct. Never corporate.
- No em dashes. Use commas or periods instead.
- Banned words: leverage, synergy, ecosystem, thrilled, excited to announce, hustle
- First line must stop the scroll. Specific, surprising, or punchy.
- Short paragraphs, 1 to 3 sentences max.
- End LinkedIn posts with a soft CTA: "If your site is the bottleneck, I do quick audit calls. Book yours at gumptiousdesignshop.com/audit"
- Instagram posts end with exactly 5 hashtags, no more no less.`;

const POSTS = [
  { key: 'monday_linkedin', day: 'Monday', platform: 'linkedin', pillar: 'expert', label: '01 Expert Insight', format: null,
    instruction: 'Write a LinkedIn post (150-200 words). Pillar: 01 Expert Insight. Authority angle. Counterintuitive design or positioning observation. No carousel, this is a text post.' },
  { key: 'tuesday_instagram', day: 'Tuesday', platform: 'instagram', pillar: 'expert', label: '01 Expert Insight', format: 'CAROUSEL: 6-8 slides. Slide 1 = hook (1 bold statement). Slides 2-6 = one idea per slide, minimal text. Last slide = soft CTA. Write the caption only (3-4 sentences + 5 hashtags). Note the slide breakdown above the caption.',
    instruction: 'Write an Instagram carousel caption (3-4 sentences + 5 hashtags). Pillar: 01 Expert Insight. Different angle from the Monday LinkedIn post. More visual and casual. Start with a brief slide breakdown (Slide 1: ..., Slide 2: ... etc), then write CAPTION: followed by the actual caption.' },
  { key: 'wednesday_linkedin', day: 'Wednesday', platform: 'linkedin', pillar: null, label: null, format: null,
    instruction: 'Write a LinkedIn post (80-120 words) as a caption for a native video upload. This is a short, punchy caption that introduces a client tension or behind-the-scenes moment. No long paragraphs.' },
  { key: 'thursday_instagram', day: 'Thursday', platform: 'instagram', pillar: 'reality', label: '02 Client Reality', format: 'TALKING HEAD REEL: Film yourself speaking to camera, casual, 30-60 seconds, no script needed. Write the caption only.',
    instruction: 'Write an Instagram Reel caption (2-3 sentences + 5 hashtags). Pillar: 02 Client Reality. Casual, conversational. The gap between what clients think they need and what actually moves them. Start with FORMAT BRIEF: Talking head reel, 30-60 seconds, casual to camera. Then write CAPTION: followed by the caption.' },
  { key: 'friday_linkedin', day: 'Friday', platform: 'linkedin', pillar: 'build', label: '03 Behind the Build', format: null,
    instruction: 'Write a LinkedIn post (150-200 words). Pillar: 03 Behind the Build. A real, human moment from building Gumptious this week. Honest, warm, no performance.' },
  { key: 'friday_instagram', day: 'Friday', platform: 'instagram', pillar: 'build', label: '03 Behind the Build', format: 'B-ROLL + TEXT OVERLAY: Film a real moment (desk, process, thinking). Text overlay carries the message. Write the caption only.',
    instruction: 'Write an Instagram single image caption (2-3 sentences + 5 hashtags). Pillar: 03 Behind the Build. Warm, candid, low effort. Start with FORMAT BRIEF: B-roll or single image, text overlay carries the message. Then write CAPTION: followed by the caption.' },
];

function setProgress(pct, step) {
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-step').textContent = step;
}

async function callAPI(prompt) {
  const response = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt })
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error);
  return data.text;
}

async function generateOnePost(post, sourceTitle, sourceType, sourcePillar, sourceContent, wedPillar) {
  const pillar = post.key === 'wednesday_linkedin' ? wedPillar : post.pillar;
  const pillarLabel = post.key === 'wednesday_linkedin' ? PILLARS[wedPillar] : post.label;

  const prompt = `${VOICE}

SOURCE MATERIAL:
Title: ${sourceTitle || 'Untitled'}
Type: ${sourceType === 'youtube' ? 'YouTube Video' : 'Blog Post'}
Primary Pillar: ${PILLARS[sourcePillar]}

${sourceContent}

TASK: ${post.instruction}
${post.key === 'wednesday_linkedin' ? `This week Wednesday pillar is: ${PILLARS[wedPillar]}` : ''}

Write ONLY the post content. No preamble, no "Here is your post:", no explanations. Just the post itself.`;

  return await callAPI(prompt);
}

async function generate() {
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('source-content').value.trim();
  const type = document.getElementById('type').value;
  const pillar = document.getElementById('pillar').value;
  const scope = document.getElementById('output-scope').value;
  const wedRotation = document.getElementById('wed-rotation').value;
  const isMonth = scope === 'month';

  if (!content) { alert('Paste some source material first.'); return; }

  // Save to vault
  if (title) {
    const exists = vault.find(v => v.title.toLowerCase() === title.toLowerCase());
    if (!exists) {
      vault.unshift({ id: nextId++, title, type, pillar, date: new Date().toLocaleDateString('en-US', {month:'long', year:'numeric'}), content });
      saveVault();
    }
  }

  const btn = document.getElementById('gen-btn');
  const progressBar = document.getElementById('progress-bar');
  const errorArea = document.getElementById('error-area');
  const outputArea = document.getElementById('output-area');

  btn.disabled = true;
  progressBar.classList.add('visible');
  errorArea.innerHTML = '';
  outputArea.innerHTML = '';

  const weeks = isMonth ? 4 : 1;
  const totalCalls = weeks * POSTS.length;
  let completed = 0;
  let allWeeks = [];

  try {
    for (let w = 0; w < weeks; w++) {
      const weekPosts = [];
      // Alternate Wednesday pillar each week
      const thisWedPillar = w % 2 === 0 ? wedRotation : (wedRotation === 'reality' ? 'build' : 'reality');

      for (let p = 0; p < POSTS.length; p++) {
        const post = POSTS[p];
        setProgress(Math.round((completed / totalCalls) * 100), `Week ${w+1} — ${post.day} ${post.platform === 'linkedin' ? 'LinkedIn' : 'Instagram'}...`);

        try {
          const text = await generateOnePost(post, title, type, pillar, content, thisWedPillar);
          const pillarKey = post.key === 'wednesday_linkedin' ? thisWedPillar : post.pillar;
          weekPosts.push({ ...post, text, pillarKey, pillarLabel: post.key === 'wednesday_linkedin' ? PILLARS[thisWedPillar] : post.label });
        } catch(err) {
          weekPosts.push({ ...post, text: `Error generating this post: ${err.message}`, pillarKey: post.pillar || 'expert', pillarLabel: post.label || '' });
        }

        completed++;
        // Small delay to avoid rate limiting
        await new Promise(r => setTimeout(r, 300));
      }
      allWeeks.push(weekPosts);
    }

    setProgress(100, 'Done!');
    setTimeout(() => progressBar.classList.remove('visible'), 1000);
    renderOutput(allWeeks, title, isMonth);

  } catch(err) {
    progressBar.classList.remove('visible');
    errorArea.innerHTML = `<div class="error"><strong>Something went wrong.</strong> ${err.message}</div>`;
  }

  btn.disabled = false;
}

function parsePostContent(post) {
  let text = post.text || '';
  let formatBrief = post.format || null;
  let caption = text;

  // Extract format brief if embedded
  if (text.includes('FORMAT BRIEF:')) {
    const parts = text.split('CAPTION:');
    if (parts.length > 1) {
      const briefPart = parts[0].replace('FORMAT BRIEF:', '').trim();
      formatBrief = briefPart;
      caption = parts[1].trim();
    }
  }

  // Extract slide breakdown for carousels
  if (text.includes('CAPTION:') && text.includes('Slide')) {
    const parts = text.split('CAPTION:');
    if (parts.length > 1) {
      formatBrief = (post.format || '') + '\n\n' + parts[0].trim();
      caption = parts[1].trim();
    }
  }

  return { formatBrief, caption };
}

function renderOutput(allWeeks, sourceTitle, isMonth) {
  const outputArea = document.getElementById('output-area');
  outputArea.innerHTML = allWeeks.map((weekPosts, i) => `
    <div class="week-heading">Week <em>${i + 1}</em>${sourceTitle && i === 0 ? ' — ' + sourceTitle : ''}</div>
    <div class="output-grid">
      ${weekPosts.map(post => {
        const { formatBrief, caption } = parsePostContent(post);
        return `
          <div class="post-card ${post.pillarKey}">
            <div class="post-meta">
              <span class="post-day">${post.day}</span>
              ${post.pillarLabel ? `<span class="pillar-tag ${post.pillarKey}">${post.pillarLabel}</span>` : ''}
              <span class="platform-tag ${post.platform}">${post.platform}</span>
            </div>
            ${formatBrief ? `<div class="format-brief">📐 ${formatBrief.replace(/\n/g, '<br>')}</div>` : ''}
            <div class="post-text">${escHtml(caption)}</div>
            <div class="post-actions">
              <button class="btn-ghost" onclick="copyText(this, ${JSON.stringify(caption)})">Copy</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

renderVault();
</script>
